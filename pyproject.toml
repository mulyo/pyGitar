[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guitarloop-klasik"
version = "0.1.0"
description = "Aplikasi desktop untuk belajar gitar klasik dengan loop presisi berbasis penanda"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "python-mpv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.2",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["guitarloop*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["mpv"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["guitarloop.core.audio_import"]
strict = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["guitarloop/tests"]
qt_wait_signal_timeout = 2000